<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glow Log - Skincare Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/lucide-static@0.321.0/font/lucide.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        .animate-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        ::-webkit-scrollbar { width: 0px; background: transparent; }
        
        .lucide {
            font-family: 'lucide' !important;
            speak: none;
            font-style: normal;
            font-weight: normal;
            font-variant: normal;
            text-transform: none;
            line-height: 1;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                    }
                }
            },
            safelist: [
                'bg-amber-500', 'bg-amber-50', 'text-amber-600', 'text-amber-700', 'border-amber-100', 'hover:bg-amber-600', 'hover:border-amber-300',
                'bg-orange-500', 'bg-orange-50', 'text-orange-600', 'text-orange-700', 'border-orange-100', 'hover:bg-orange-600', 'hover:border-orange-300',
                'bg-indigo-500', 'bg-indigo-600', 'bg-indigo-700', 'bg-indigo-900', 'bg-indigo-50', 'text-indigo-600', 'text-indigo-700', 'text-indigo-100', 'text-indigo-200', 'text-indigo-300', 'text-indigo-900', 'border-indigo-100', 'border-indigo-200', 'border-indigo-300', 'hover:bg-indigo-700', 'hover:border-indigo-300',
                'bg-rose-500', 'bg-rose-600', 'bg-rose-50', 'bg-rose-100', 'text-rose-600', 'text-rose-700', 'text-rose-800', 'text-rose-900', 'text-rose-100', 'border-rose-100', 'border-rose-300', 'border-rose-500/40', 'hover:bg-rose-600', 'hover:border-rose-300',
                'bg-cyan-50', 'bg-cyan-100', 'text-cyan-600', 'text-cyan-700', 'text-cyan-800', 'text-cyan-900', 'border-cyan-100', 'hover:border-cyan-300',
                'bg-emerald-50', 'bg-emerald-100', 'bg-emerald-500', 'text-emerald-500', 'text-emerald-600', 'text-emerald-700', 'text-emerald-900', 'border-emerald-100', 'border-emerald-200', 'hover:border-emerald-300',
                'bg-purple-50', 'bg-purple-100', 'text-purple-600', 'text-purple-700', 'text-purple-900', 'border-purple-100', 'hover:border-purple-300',
                'border-transparent', 'bg-slate-50/50', 'hover:bg-slate-100', 'border-emerald-300', 'bg-emerald-50', 'border-emerald-200', 'bg-emerald-500', 'text-emerald-500', 'shadow-lg', 'shadow-indigo-100'
            ]
        }
    </script>
</head>
<body class="bg-slate-50 text-slate-900 overflow-x-hidden">

    <!-- Main Container -->
    <div id="app" class="min-h-screen pb-20 selection:bg-indigo-100">
        <!-- Rendered dynamically by script -->
    </div>

    <script>
        
        // State variables
        const state = {
            currentMonth: new Date(),
            selectedDate: null,
            view: 'calendar', // 'calendar' or 'detail'
            completedSteps: JSON.parse(localStorage.getItem('glow_log_v_final_updated') || '{}'),
            openSections: {
                morning: false,
                afternoon: false,
                night: false
            }
        };

        const nightRotation = {
            'Monday': { focus: 'Pigmentation', color: 'rose', description: 'Kojic Acid + Alpha Arbutin', details: 'Breaks pigment, lightens corners. Do not combine with retinol.' },
            'Tuesday': { focus: 'Retinol', color: 'indigo', description: 'Retinol (0.2–0.3%) + Niacinamide & Hyaluronic Acid', details: 'Improves texture, speeds fading. Niacinamide stabilizes brightness.' },
            'Wednesday': { focus: 'Hydration', color: 'cyan', description: 'Niacinamide + Hyaluronic Acid', details: 'Barrier healing, calm skin, glow foundation.' },
            'Thursday': { focus: 'Pigmentation', color: 'rose', description: 'Kojic Acid + Alpha Arbutin', details: 'Extra dot around mouth corners.' },
            'Friday': { focus: 'Retinol', color: 'indigo', description: 'Retinol (0.2–0.3%) + Niacinamide & Hyaluronic Acid', details: 'Pea-size only. Future-proofs skin. HA amplifies glow.' },
            'Saturday': { focus: 'Peptides', color: 'purple', description: 'Skin Polishing (Peptides)', details: 'Enhances elasticity for "expensive" skin.' },
            'Sunday': { focus: 'Barrier Repair', color: 'emerald', description: 'Ceramide cream / sleeping mask', details: 'No actives. Let skin recover. Panthenol & Shea.' },
        };

        const routines = {
            Morning: {
                goal: "instant brightness, hydration, protection, glow that lasts all day",
                icon: "sun",
                color: "amber",
                steps: [
                    { id: 'm1', name: "Step 1 — CLEANSER (Hydrating, non-foaming)", points: ["Cream / lotion cleanser only", "Keeps natural oils intact", "Prevents dullness caused by dryness"], brain: "Dry skin must NEVER feel tight after washing." },
                    { id: 'm2', name: "Step 2 — HYDRATING TONER / ESSENCE", sub: "FOUNDATION OF RADIANCE", badge: "NON-NEGOTIABLE", points: ["Floods skin with water", "Makes skin look plump, fresh, brighter", "Helps serums absorb evenly"], checklist: ["Apply with hands, press gently", "Can use 1–2 layers if skin feels dry"] },
                    { id: 'm3', name: "Step 3 — VITAMIN C SERUM (BRIGHTNESS CORE)", points: ["Removes oxidative dullness", "Improves clarity", "Prevents further darkening"], checklist: ["2–3 drops only", "Use daily, morning only"] },
                    { id: 'm4', name: "Step 4 — NIACINAMIDE (3–5%)", points: ["Strengthens barrier", "Smooths texture", "Makes brightness stable (not temporary)", "Supports pigmentation control (PCOD-safe)"], checklist: ["Apply thin layer"] },
                    { id: 'm5', name: "Step 5 — HYALURONIC ACID SERUM (GLOW AMPLIFIER)", points: ["Deep hydration", "Plumps skin → reflects more light", "Makes skin look instantly fresher"], brain: "Apply on slightly damp skin" },
                    { id: 'm6', name: "Step 6 — MOISTURIZER (CERAMIDE-RICH)", points: ["Locks all hydration layers", "Prevents dryness-related dullness", "Keeps skin smooth and elastic"], checklist: ["Must contain ceramides + fatty acids"] },
                    { id: 'm7', name: "Step 7 — SUNSCREEN SPF 50 PA++++", sub: "MOST IMPORTANT STEP", points: ["Prevents tanning & pigmentation", "Protects lip-corner area", "Preserves all brightness you build"], checklist: ["Apply generously", "Around mouth, jaw, under nose", "Daily — even indoors"] },
                ]
            },
            Afternoon: {
                goal: "Protection reapplication & hydration refresh",
                icon: "cloud-sun",
                color: "orange",
                steps: [
                    { id: 'a1', name: "Step 1 — 🔁 SUNSCREEN REAPPLICATION", points: ["Use stick / compact / gel"] },
                    { id: 'a2', name: "Step 2 — 💦 HYDRATION REFRESH (Optional)", points: ["Hydrating mist OR Tiny tap of HA gel on cheeks"], checklist: ["Revives glow instantly", "No makeup needed"] },
                ]
            },
            Night: {
                goal: "repair, pigment correction, long-term radiance",
                icon: "moon",
                color: "indigo",
                steps: [
                    { id: 'n1', name: "Step 1 — CLEANSER", points: ["Same gentle hydrating cleanser."] },
                    { id: 'n2', name: "Step 2 — HYDRATING TONER / ESSENCE", points: ["Yes, again.", "Dry skin needs water before treatment."] },
                    { id: 'n_active', name: "Step 3 — NIGHT ACTIVE ROTATION", isRotation: true },
                    { id: 'n3', name: "Step 4 — NIGHT MOISTURIZER (RICH)", points: ["Thick, nourishing", "Prevents moisture loss", "Ensures bright morning skin"] },
                    { id: 'n4', name: "Step 5 — FACIAL OIL (OPTIONAL BUT IDEAL)", points: ["2–3 drops only", "Best: squalane / rosehip"], checklist: ["Seals hydration", "Prevents dry, dull wake-up skin"] },
                ]
            }
        };

        // Utility: Date formatter
        function formatDateKey(date) {
            if (!date) return '';
            return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
        }

        // Utility: Progress calculator
        function getProgress(date) {
            const key = formatDateKey(date);
            if (!state.completedSteps[key]) return 0;
            const total = routines.Morning.steps.length + routines.Afternoon.steps.length + routines.Night.steps.length;
            const completedCount = Object.values(state.completedSteps[key]).filter(Boolean).length;
            return Math.round((completedCount / total) * 100);
        }

        // Save State Helper
        function saveState() {
            localStorage.setItem('glow_log_v_final_updated', JSON.stringify(state.completedSteps));
        }


        // Render functions
        function renderApp() {
            const container = document.getElementById('app');
            container.innerHTML = '';

            if (state.view === 'calendar') {
                renderCalendar(container);
            } else {
                renderDetail(container);
            }
        }

        function renderCalendar(container) {
            const year = state.currentMonth.getFullYear();
            const month = state.currentMonth.getMonth();
            const monthName = state.currentMonth.toLocaleString('default', { month: 'long', year: 'numeric' });

            // Generate Calendar Days Array
            const days = [];
            const totalDays = new Date(year, month + 1, 0).getDate();
            const startDay = new Date(year, month, 1).getDay();
            for (let i = 0; i < startDay; i++) days.push(null);
            for (let d = 1; d <= totalDays; d++) days.push(new Date(year, month, d));

            let daysHTML = '';
            days.forEach((date, i) => {
                if (!date) {
                    daysHTML += `<div></div>`;
                    return;
                }
                const isToday = date.toDateString() === new Date().toDateString();
                const progress = getProgress(date);
                const progressKey = formatDateKey(date);

                let progressTracker = '';
                if (progress > 0) {
                    progressTracker = `
                        <div class="w-10 h-1 bg-slate-200 rounded-full mt-1.5 overflow-hidden">
                            <div class="h-full bg-indigo-500 transition-all" style="width: ${progress}%"></div>
                        </div>
                    `;
                }

                let checkIcon = '';
                if (progress === 100) {
                    checkIcon = `<i class="lucide lucide-check-circle-2 text-emerald-500 absolute top-3 right-3" style="font-size: 14px"></i>`;
                }

                daysHTML += `
                    <button onclick="selectDate(${date.getTime()})" class="relative aspect-square rounded-[1.8rem] transition-all p-3 flex flex-col items-center justify-center gap-1 border-2 ${isToday ? 'border-indigo-500 bg-indigo-50/30 shadow-lg shadow-indigo-100' : progress > 0 ? 'border-indigo-100 bg-indigo-50/10' : 'border-transparent bg-slate-50/50 hover:bg-slate-100/80 hover:scale-[1.02]'}">
                        <span class="text-lg font-bold ${isToday ? 'text-indigo-600' : 'text-slate-700'}">${date.getDate()}</span>
                        ${progressTracker}
                        ${checkIcon}
                    </button>
                `;
            });

            container.innerHTML = `
                <div class="max-w-5xl mx-auto p-4 md:p-10 animate-in">
                    <header class="flex flex-col md:flex-row md:items-center justify-between gap-6 mb-10 text-center md:text-left">
                        <div>
                            <h1 class="text-4xl font-extrabold text-slate-900 tracking-tight flex items-center justify-center md:justify-start gap-3 italic">
                                <i class="lucide lucide-sparkles text-indigo-600" style="font-size: 32px"></i> GLOW LOG
                            </h1>
                            <p class="text-slate-500 font-bold uppercase tracking-widest text-[10px] mt-1">Daily Skin Health System</p>
                        </div>
                        <div class="flex items-center gap-3 bg-white p-2.5 rounded-3xl border border-slate-200 shadow-sm self-center md:self-start">
                            <button onclick="changeMonth(-1)" class="p-2 hover:bg-slate-50 rounded-2xl"><i class="lucide lucide-chevron-left"></i></button>
                            <span class="font-black min-w-[140px] text-center uppercase tracking-widest text-[11px] text-slate-700">${monthName}</span>
                            <button onclick="changeMonth(1)" class="p-2 hover:bg-slate-50 rounded-2xl"><i class="lucide lucide-chevron-right"></i></button>
                        </div>
                    </header>

                    <!-- Monthly Calendar Grid Card -->
                    <div class="bg-white rounded-[3rem] border border-slate-200 shadow-2xl overflow-hidden mb-16">
                        <div class="grid grid-cols-7 border-b border-slate-100 bg-slate-50/40">
                            ${['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].map(d => `
                                <div class="py-5 text-center text-[10px] font-black uppercase tracking-widest text-slate-400">${d}</div>
                            `).join('')}
                        </div>
                        <div class="grid grid-cols-7 p-3 md:p-8 gap-3 md:gap-5">
                            ${daysHTML}
                        </div>
                    </div>

                    <!-- The Handbook Accordions -->
                    <div class="space-y-6 px-2">
                        <div class="flex items-center gap-4">
                            <i class="lucide lucide-book-open text-indigo-600" style="font-size: 20px"></i>
                            <h2 class="text-2xl font-black text-slate-800 uppercase tracking-wider">The Handbook</h2>
                            <div class="h-px flex-1 bg-slate-200"></div>
                        </div>
                        
                        ${renderHandbookDropdown('morning', 'Morning Routine', 'amber', 'sun', routines.Morning)}
                        ${renderHandbookDropdown('afternoon', 'Afternoon Routine', 'orange', 'cloud-sun', routines.Afternoon)}
                        ${renderHandbookDropdown('night', 'Night Routine', 'indigo', 'moon', routines.Night)}
                    </div>
                </div>
            `;
        }


        function renderHandbookDropdown(key, title, color, icon, routine) {
            const isOpen = state.openSections[key];
            let contentHTML = '';

            if (isOpen) {
                if (key === 'night') {
                    // Custom template layout containing Night Rotation list elements specifically
                    contentHTML = `
                        <div class="p-6 md:p-12 space-y-12 animate-in border-t border-slate-100">
                            ${renderManualStep(routine.steps[0], color)}
                            ${renderManualStep(routine.steps[1], color)}
                            
                            <!-- Rotation Visualizer Card inside Accordion -->
                            <div class="bg-slate-50 rounded-[2.5rem] p-6 md:p-10 border border-slate-200 my-8">
                                <div class="flex items-center gap-4 mb-8">
                                    <div class="p-3 bg-white rounded-2xl shadow-sm text-indigo-600">
                                        <i class="lucide lucide-zap" style="font-size: 24px"></i>
                                    </div>
                                    <h3 class="text-lg font-black text-slate-800 uppercase">Weekly Active Rotation</h3>
                                </div>
                                <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
                                    ${renderRotationDetailCard("🔹 Pigmentation", "Mon & Thu", "Kojic Acid + Arbutin", "rose", ["Breaks pigment", "Lightens corners"], ["Thin layer"], "No retinol")}
                                    ${renderRotationDetailCard("🔹 Retinol", "Tue & Fri", "Retinol (0.2–0.3%) + Niacinamide & HA", "indigo", ["Improves texture", "Speeds fading", "Niacinamide stabilizes glow"], ["Pea-size only", "Follow with moisturizer"], "")}
                                    ${renderRotationDetailCard("🔹 Hydration", "Wed", "Niacinamide + HA", "cyan", ["Barrier healing", "Calm skin"], [], "")}
                                    ${renderRotationDetailCard("🔹 Peptide", "Sat", "Skin Polishing (Peptides)", "purple", ["Polished look", "Elasticity boost"], [], "")}
                                    ${renderRotationDetailCard("🔹 Barrier", "Sun", "Ceramide / Mask", "emerald", ["Let skin recover"], [], "No actives")}
                                </div>
                            </div>
                            
                            ${renderManualStep(routine.steps[3], color)}
                            ${renderManualStep(routine.steps[4], color)}
                        </div>
                    `;
                } else {
                    contentHTML = `
                        <div class="p-6 md:p-12 space-y-12 animate-in border-t border-slate-100">
                            ${routine.steps.map(s => renderManualStep(s, color)).join('')}
                        </div>
                    `;
                }
            }

            return `
                <div class="bg-white rounded-[2.5rem] border border-slate-200 shadow-sm overflow-hidden mb-4 transition-all">
                    <button onclick="toggleSection('${key}')" class="w-full flex items-center justify-between bg-${color}-500 hover:bg-${color}-600 p-7 text-white active:scale-[0.99] transition-all">
                        <div class="flex items-center gap-4">
                            <i class="lucide lucide-${icon}" style="font-size: 28px"></i>
                            <div class="text-left">
                                <h3 class="text-xl font-black uppercase tracking-tight">${title}</h3>
                                <p class="font-bold opacity-80 text-[9px] hidden sm:block uppercase tracking-widest">${routine.goal}</p>
                            </div>
                        </div>
                        <i class="lucide lucide-chevron-down transition-transform duration-300 ${isOpen ? 'rotate-180' : ''}" style="font-size: 24px"></i>
                    </button>
                    ${contentHTML}
                </div>
            `;
        }

        function renderManualStep(step, color) {
            const badgeHTML = step.badge ? `
                <span class="px-2 py-0.5 bg-${color}-50 text-${color}-700 text-[9px] font-black uppercase rounded-lg border border-${color}-100">
                    ${step.badge}
                </span>
            ` : '';

            const pointsHTML = step.points ? `
                <ul class="space-y-1.5">
                    ${step.points.map(p => `<li class="text-sm text-slate-600 font-bold leading-relaxed">• ${p}</li>`).join('')}
                </ul>
            ` : '';

            const checklistHTML = step.checklist ? `
                <div class="flex flex-wrap gap-2 pt-1">
                    ${step.checklist.map(c => `
                        <span class="text-[10px] font-black text-${color}-700 bg-${color}-50 px-3 py-1.5 rounded-xl border border-${color}-100 flex items-center gap-2">
                            <i class="lucide lucide-check-circle-2" style="font-size: 12px"></i> ${c}
                        </span>
                    `).join('')}
                </div>
            ` : '';

            const brainHTML = step.brain ? `
                <div class="inline-flex items-start gap-5 bg-indigo-50 p-5 rounded-2xl border border-indigo-100">
                    <span class="text-2xl">🧠</span>
                    <p class="text-xs font-bold text-indigo-700 leading-relaxed italic">${step.brain}</p>
                </div>
            ` : '';

            return `
                <div class="flex flex-col md:flex-row items-start gap-6 group">
                    <div class="w-12 h-12 rounded-2xl bg-slate-50 border border-slate-100 flex items-center justify-center font-black text-slate-300 shrink-0">
                        ${step.isRotation ? '★' : step.id.slice(1)}
                    </div>
                    <div class="flex-1 space-y-4">
                        <div class="flex flex-wrap items-center gap-3">
                            <h4 class="text-xl font-black text-slate-800 uppercase tracking-tight">${step.name}</h4>
                            ${badgeHTML}
                        </div>
                        ${step.sub ? `<p class="text-[10px] text-slate-400 font-bold uppercase">${step.sub}</p>` : ''}
                        ${pointsHTML}
                        ${checklistHTML}
                        ${brainHTML}
                    </div>
                </div>
            `;
        }

        function renderRotationDetailCard(focus, days, ingredients, color, points, checklist, warning) {
            const warningHTML = warning ? `
                <div class="pt-2 flex items-center gap-2 text-[9px] font-black text-rose-500 uppercase">
                    <i class="lucide lucide-alert-circle" style="font-size: 14px"></i> ${warning}
                </div>
            ` : '';

            const checklistHTML = checklist.length > 0 ? `
                <div class="space-y-2 pt-2">
                    ${checklist.map(c => `
                        <div class="text-[9px] font-black text-${color}-700 flex items-center gap-2">
                            <i class="lucide lucide-check-circle-2" style="font-size: 14px"></i> ${c}
                        </div>
                    `).join('')}
                </div>
            ` : '';

            return `
                <div class="p-6 rounded-[2rem] border border-${color}-100 bg-white flex flex-col h-full">
                    <div class="flex items-center justify-between mb-4">
                        <h5 class="text-base font-black text-${color}-900 uppercase tracking-tighter">${focus}</h5>
                        <span class="px-3 py-1 bg-${color}-50 text-${color}-600 rounded-xl text-[9px] font-black uppercase">${days}</span>
                    </div>
                    <p class="text-[11px] font-black text-slate-800 mb-4 bg-slate-50 p-3 rounded-xl border border-slate-100 italic">${ingredients}</p>
                    <div class="space-y-3 flex-1">
                        ${points.map(p => `<p class="text-[10px] font-bold text-slate-500 flex items-start gap-2">• ${p}</p>`).join('')}
                        ${checklistHTML}
                        ${warningHTML}
                    </div>
                </div>
            `;
        }


        function renderDetail(container) {
            const dateKey = formatDateKey(state.selectedDate);
            const progress = getProgress(state.selectedDate);
            const selectedDayName = new Intl.DateTimeFormat('en-US', { weekday: 'long' }).format(state.selectedDate);
            const dateStr = state.selectedDate.toLocaleDateString('default', { day: 'numeric', month: 'long' });

            let sectionsHTML = '';

            Object.entries(routines).forEach(([name, config]) => {
                let stepsHTML = '';

                config.steps.forEach((step) => {
                    const isDone = state.completedSteps[dateKey]?.[step.id];

                    if (step.isRotation) {
                        const rot = nightRotation[selectedDayName];
                        const rotBgBorder = isDone 
                            ? 'bg-emerald-50 border-emerald-300 shadow-inner' 
                            : `bg-${rot.color}-50/30 border-${rot.color}-100 hover:border-${rot.color}-300`;
                        const rotBtnStyle = isDone 
                            ? 'bg-emerald-500 border-emerald-500 text-white shadow-lg' 
                            : 'border-slate-200 bg-white';
                        const rotHeaderStyle = isDone 
                            ? 'text-slate-400 line-through' 
                            : `text-${rot.color}-900 uppercase tracking-tight`;

                        stepsHTML += `
                            <div onclick="toggleStep('${step.id}')" class="p-7 rounded-[2.5rem] border-2 transition-all cursor-pointer flex items-start gap-5 ${rotBgBorder}">
                                <div class="w-12 h-12 rounded-3xl flex items-center justify-center border-2 shrink-0 transition-all ${rotBtnStyle}">
                                    ${isDone ? `<i class="lucide lucide-check-circle-2" style="font-size: 22px"></i>` : `<i class="lucide lucide-zap text-${rot.color}-600" style="font-size: 18px"></i>`}
                                </div>
                                <div class="flex-1">
                                    <p class="text-[10px] font-black uppercase text-slate-400 mb-1">Step 3 — Active Rotation</p>
                                    <h4 class="text-lg font-bold ${rotHeaderStyle}">${rot.focus} Night</h4>
                                    <p class="text-[11px] text-slate-500 font-medium leading-relaxed mt-1">${rot.description}</p>
                                    <p class="text-[10px] text-slate-400 font-semibold leading-relaxed mt-1">${rot.details}</p>
                                </div>
                            </div>
                        `;
                    } else {
                        stepsHTML += `
                            <div onclick="toggleStep('${step.id}')" class="flex items-center gap-4 p-5 rounded-[2rem] border-2 transition-all cursor-pointer ${isDone ? 'bg-white border-emerald-100 opacity-60' : 'bg-white border-slate-100 hover:border-slate-300 shadow-sm'}">
                                <div class="w-8 h-8 rounded-full flex items-center justify-center border-2 shrink-0 ${isDone ? 'bg-emerald-500 border-emerald-500 text-white shadow-md' : 'border-slate-200'}">
                                    ${isDone ? `<i class="lucide lucide-check-circle-2" style="font-size: 16px"></i>` : ''}
                                </div>
                                <div class="flex-1">
                                    <h4 class="font-bold text-sm ${isDone ? 'text-slate-400 line-through' : 'text-slate-800 uppercase tracking-tight'}">${step.name}</h4>
                                    ${step.sub ? `<p class="text-[10px] text-slate-400 font-bold uppercase mt-0.5">${step.sub}</p>` : ''}
                                </div>
                            </div>
                        `;
                    }
                });

                sectionsHTML += `
                    <section>
                        <div class="flex items-center gap-4 mb-6">
                            <div class="p-3 bg-${config.color}-50 text-${config.color}-600 rounded-2xl">
                                <i class="lucide lucide-${config.icon}" style="font-size: 24px"></i>
                            </div>
                            <h3 class="text-xl font-black text-slate-800 uppercase">${name}</h3>
                        </div>
                        <div class="space-y-3">
                            ${stepsHTML}
                        </div>
                    </section>
                `;
            });

            container.innerHTML = `
                <div class="max-w-4xl mx-auto p-4 md:p-8 animate-in">
                    <button onclick="setView('calendar')" class="mb-6 flex items-center gap-2 text-slate-500 font-bold text-xs uppercase tracking-widest bg-white px-6 py-3 rounded-2xl border border-slate-200 shadow-sm">
                        <i class="lucide lucide-chevron-left" style="font-size: 16px"></i> Back to Calendar
                    </button>
                    <div class="bg-white rounded-[3rem] border border-slate-200 shadow-2xl overflow-hidden">
                        <div class="bg-slate-900 text-white p-8 md:p-14 relative overflow-hidden">
                           <div class="relative z-10">
                              <p class="text-indigo-400 font-black uppercase tracking-[0.3em] text-[10px] mb-2">${selectedDayName}</p>
                              <h2 class="text-3xl md:text-4xl font-extrabold mb-6 tracking-tight">${dateStr}</h2>
                              <div class="flex items-center gap-4">
                                  <div class="h-2 w-32 bg-white/10 rounded-full overflow-hidden">
                                      <div class="h-full bg-indigo-400 transition-all duration-500" style="width: ${progress}%"></div>
                                  </div>
                                  <span class="text-[10px] font-bold text-indigo-300 uppercase">${progress}% Completed</span>
                              </div>
                           </div>
                        </div>
                        <div class="p-6 md:p-14 space-y-12">
                            ${sectionsHTML}
                        </div>
                    </div>
                </div>
            `;
        }


        // Event Handler Routing functions
        function selectDate(timestamp) {
            state.selectedDate = new Date(timestamp);
            state.view = 'detail';
            renderApp();
        }

        function setView(viewMode) {
            state.view = view;
            state.view = viewMode;
            renderApp();
        }

        function changeMonth(direction) {
            state.currentMonth = new Date(state.currentMonth.getFullYear(), state.currentMonth.getMonth() + direction, 1);
            renderApp();
        }

        function toggleSection(key) {
            state.openSections[key] = !state.openSections[key];
            renderApp();
        }

        function toggleStep(stepId) {
            const dateKey = formatDateKey(state.selectedDate);
            if (!state.completedSteps[dateKey]) {
                state.completedSteps[dateKey] = {};
            }
            state.completedSteps[dateKey][stepId] = !state.completedSteps[dateKey][stepId];
            saveState();
            renderApp();
        }

        // Initialize App on Window Load
        window.onload = function() {
            renderApp();
        }
    </script>
</body>
</html>
